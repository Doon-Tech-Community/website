name: Bug report
description: Report something broken in the DTC Pokedex.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken, and what did you expect to happen?
      placeholder: The attendee filter shows archived profiles when...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that triggers the issue.
      placeholder: |
        1. Go to /dex
        2. Search for ...
        3. Notice ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      placeholder: What should have happened?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public dex
        - Attendee profile
        - Auth or profile setup
        - Admin dashboard
        - Events, tags, or badges
        - Appwrite schema or data
        - Build, deployment, or config
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, device, OS, and whether this happened locally or in production.
      placeholder: Chrome on Windows, local dev server on Node ...
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant console/server output or attach screenshots.
      render: shell
